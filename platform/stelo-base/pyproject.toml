[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stelo-base"
version = "0.1.0"
description = "Shared streams, messaging, web app and security helpers for stelo services"
requires-python = ">=3.13,<3.14"
dependencies = [
    "monobase",
    "sqlalchemy[asyncio]>=2.0",
    "rbfly",
    "aiohttp",
    "uvloop",
    "orjson",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stelo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "E", "B", "I", "PL", "C90"]
ignore = ["PLR2004", "PLC0415"]

fixable = ["ALL"]
unfixable = ["B"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
