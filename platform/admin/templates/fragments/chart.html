<svg id="chart" viewBox="0 0 {{ width }} {{ height }}" preserveAspectRatio="none" data-series="{{ series_json }}" data-step="{{ step }}" data-pad-l="{{ pad_l }}" data-pad-t="{{ pad_t }}" data-inner-h="{{ inner_h }}" data-hi="{{ hi }}">{% for g in gridlines %}<line x1="{{ pad_l }}" x2="{{ width - pad_r }}" y1="{{ g.y }}" y2="{{ g.y }}" stroke="var(--grid)" stroke-width="1"/><text x="4" y="{{ g.label_y }}" font-size="9" fill="var(--text-muted)" font-family="IBM Plex Mono, monospace">{{ g.label }}</text>{% endfor %}<line x1="{{ pad_l }}" x2="{{ width - pad_r }}" y1="{{ axis_y }}" y2="{{ axis_y }}" stroke="var(--axis)" stroke-width="1"/>{% for s in series %}<polyline points="{{ s.points }}" fill="none" stroke="{{ s.color }}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>{% endfor %}</svg>
