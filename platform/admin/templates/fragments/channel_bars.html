<div id="channels">{% for r in rows %}<div class="chan-row"><div class="chan-name">{{ r.channel }}</div><div class="chan-bar-track"><div class="chan-bar-seg" style="width:{{ r.sent_pct }}%;background:var(--good)"></div><div class="chan-bar-seg" style="width:{{ r.fail_pct }}%;background:var(--critical)"></div></div><div class="chan-count"><b>{{ r.sent_fmt }}</b> <span class="fail-text">/ {{ r.failed_fmt }}</span></div></div>{% endfor %}</div>
