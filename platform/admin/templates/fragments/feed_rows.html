<div id="feed">{% for e in events %}<div class="feed-row"><div class="feed-time">{{ e.time }}</div><div class="badge" style="background:color-mix(in srgb, {{ e.color }} 16%, transparent); color:{{ e.color }}"><span class="bdot" style="background:{{ e.color }}"></span>{{ e.label }}</div><div class="feed-id">{{ e.id }}</div><div class="feed-chan">{{ e.channel }}</div></div>{% endfor %}</div>
