[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stelo-admin"
version = "0.0.1"
description = "Read-only ops dashboard over the inbox/traffic/dispatcher pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
    "stelo-base",
    "aiohttp-jinja2",
]

[tool.uv.sources]
stelo-base = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stelo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "E", "B", "I", "PL", "C90"]
ignore = ["PLR2004", "PLC0415"]

fixable = ["ALL"]
unfixable = ["B"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
