[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stelo-inbox"
version = "0.0.1"
description = "Receives communication requests over HTTP"
requires-python = ">=3.13,<3.14"
dependencies = [
    "stelo-base",
]

[tool.uv.sources]
stelo-base = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stelo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
