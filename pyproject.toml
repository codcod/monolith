# Workspace root — not a package itself (`tool.uv.package = false`), just the
# shared venv/lockfile for every module under platform/ and the dev tooling
# (ruff/ty) config that applies to all of them. Each module keeps its own
# [build-system]/[project] in its own pyproject.toml and is versioned/
# released independently — there is no top-level "stelo platform" package.
[project]
name = "stelo-platform"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "platform/stelo-base",
    "platform/inbox",
    "platform/traffic",
    "platform/dispatcher",
    "platform/admin",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["**/tests"]

[tool.ty.environment]
root = [
    "platform/stelo-base/src",
    "platform/inbox/src",
    "platform/traffic/src",
    "platform/dispatcher/src",
    "platform/admin/src",
]
