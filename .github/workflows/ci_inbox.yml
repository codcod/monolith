---
    name: CI platform/inbox

    on:
      pull_request:
        paths:
          - 'dev-requirements.txt'
          - 'pip-requirements.txt'
          - '.github/workflows/python_reusable.yml'
          - '.github/workflows/ci_inbox.yml'
          - 'platform/inbox/**'
      workflow_dispatch:  # Allows to trigger the workflow manually in GitHub UI

    jobs:
      ci-platform-inbox:
        uses:
          ./.github/workflows/python_reusable.yml
        with:
          working-directory: platform/inbox
        secrets: inherit