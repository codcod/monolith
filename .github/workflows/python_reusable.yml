name: Reusable Python module CI

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: "Path (from repo root) of the module to lint/type-check/test"
      package-name:
        required: true
        type: string
        description: "uv workspace package name to sync, e.g. stelo-inbox"
      lint-paths:
        default: "src tests"
        type: string
        description: "Paths (relative to working-directory) ruff should check/format-check"
      install-packages:
        default: ""
        type: string
        description: "Space-separated apt packages to install before `uv sync` (e.g. native build deps)"

jobs:
  module-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install extra packages
        if: ${{ inputs.install-packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${{ inputs.install-packages }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --project points at the workspace root (so the shared dev
      # dependency-group — ruff/ty/pytest — is included) while --package
      # scopes the sync to this module and its own dependency closure.
      - name: Sync workspace deps for this package
        run: uv sync --project "$GITHUB_WORKSPACE" --locked --package ${{ inputs.package-name }}

      - name: Lint
        run: uv run --project "$GITHUB_WORKSPACE" ruff check ${{ inputs.lint-paths }}

      - name: Format check
        run: uv run --project "$GITHUB_WORKSPACE" ruff format --check ${{ inputs.lint-paths }}

      # Only src/ is type-checked — tests use loose fakes/doubles that
      # aren't meant to type-check against the real classes they stand in for.
      - name: Type-check
        run: uv run --project "$GITHUB_WORKSPACE" ty check src

      - name: Test
        run: uv run --project "$GITHUB_WORKSPACE" pytest -q
