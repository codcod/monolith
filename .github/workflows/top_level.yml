name: Top-level CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main

concurrency:
  group: ci-top-level-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full-stack smoke test: builds all three service images, brings up
  # postgres/rabbitmq, runs every service's *-migrate one-shot, starts all
  # three services, and checks inbox's /health — the same thing `just up`
  # does locally. Runs on every PR (not path-filtered) since it's the one
  # check that exercises the whole compose stack together, not one module
  # in isolation.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up local env
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for inbox health
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::inbox never became healthy"
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download actionlint
        run: |
          curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest .
      - name: Lint workflows
        run: ./actionlint -color
